# params.yaml — Wildfire Robotics UGV
# Configurazione centralizzata per tutti i nodi.
#
# Formato: una sezione top-level per nodo, chiave = nome del nodo
# (deve combaciare con `name=` nel launch file). Sotto `ros__parameters`
# i valori vanno in piatto, non annidati per nome del nodo.
#
# La precedente struttura `wildfire_vision: /**: ros__parameters: …`
# generava un namespace `/wildfire_vision//` con doppia barra che ROS2
# Humble rifiuta in fase di parsing.

camera_node:
  ros__parameters:
    device: "/dev/video2"
    frame_width: 640
    frame_height: 480
    fps: 15
    camera_name: 'camera'

person_detector_node:
  ros__parameters:
    camera_topic: '/camera/image_raw'
    inference_server: 'ws://10.75.58.4:8765'

fire_detector_node:
  ros__parameters:
    camera_topic: '/camera/image_raw'
    red_h1_low: 0
    red_h1_high: 10
    red_h2_low: 170
    red_h2_high: 180
    orange_h_low: 11
    orange_h_high: 25
    sat_min: 150
    val_min: 150
    min_area: 500.0
    kernel_size: 5
    enable_red: true
    enable_orange: true

follow_controller_node:
  ros__parameters:
    target_distance_cm: 100.0
    min_safe_distance_cm: 60.0
    max_distance_cm: 400.0
    linear_kp: 0.010
    angular_kp: 0.20
    max_linear_speed: 0.25
    max_angular_speed: 0.40
    min_turn_speed: 0.35
    min_drive: 0.35
    min_drive_reverse: 0.35
    loop_rate_hz: 10.0
    power_percentage: 1.0
    center_deadband: 0.8
    distance_deadband: 6.0
    lost_person_timeout_s: 1.5
    sensor_timeout_s: 1.0

fire_controller_node:
  ros__parameters:
    pan_min_deg: -60.0
    pan_max_deg: 60.0
    tilt_min_deg: -30.0
    tilt_max_deg: 30.0
    sweep_step_deg: 0.5
    sweeping_update_freq: 80.0
    tilt_increment_deg: 5.0
    pd_kp_pan: 0.5
    pd_kp_tilt: 0.5
    pd_kd: 0.1
    lock_threshold_px: 500.0
    lock_time_s: 0.5
    unlock_time_s: 0.3
    lock_deadband_px: 40.0
    lock_kp: 0.02
    lock_max_step_deg: 1.0
    min_fire_area: 500.0
    loop_rate_hz: 20.0

mcu_sim_node:
  ros__parameters:
    distance_left_cm: 80.0
    distance_right_cm: 80.0
    publish_rate_hz: 10.0
    fov_rad: 0.26
    min_range_m: 0.02
    max_range_m: 4.00
