# params.yaml — Wildfire Robotics UGV
# Configurazione centralizzata per tutti i nodi.
#
# Formato: una sezione top-level per nodo, chiave = nome del nodo
# (deve combaciare con `name=` nel launch file). Sotto `ros__parameters`
# i valori vanno in piatto, non annidati per nome del nodo.
#
# La precedente struttura `wildfire_vision: /**: ros__parameters: …`
# generava un namespace `/wildfire_vision//` con doppia barra che ROS2
# Humble rifiuta in fase di parsing.

camera_node:
  ros__parameters:
    device_id: 0
    frame_width: 640
    frame_height: 480
    fps: 15
    camera_name: 'camera'
    test_image_path: '/home/project/test_images/test_person.jpg'

person_detector_node:
  ros__parameters:
    camera_topic: '/camera/image_raw'
    conf_threshold: 0.5
    model_name: 'yolov8n.pt'
    device: 'cpu'

fire_detector_node:
  ros__parameters:
    camera_topic: '/camera/image_raw'
    red_h1_low: 0
    red_h1_high: 10
    red_h2_low: 170
    red_h2_high: 180
    orange_h_low: 11
    orange_h_high: 25
    sat_min: 150
    val_min: 150
    min_area: 500.0
    kernel_size: 5
    enable_red: true
    enable_orange: true

follow_controller_node:
  ros__parameters:
    target_distance_cm: 80.0
    min_safe_distance_cm: 40.0
    max_distance_cm: 200.0
    linear_kp: 0.01
    angular_kp: 0.5
    max_linear_speed: 0.5
    max_angular_speed: 1.0
    min_turn_speed: 0.2
    loop_rate_hz: 10.0

fire_controller_node:
  ros__parameters:
    pan_min_deg: -60.0
    pan_max_deg: 60.0
    tilt_min_deg: 0.0
    tilt_max_deg: 30.0
    sweep_step_deg: 0.5
    sweep_pause_s: 0.2
    tilt_increment_deg: 0.5
    pd_kp_pan: 0.5
    pd_kp_tilt: 0.5
    pd_kd: 0.1
    lock_threshold_px: 20.0
    lock_time_s: 0.5
    unlock_time_s: 0.3
    min_fire_area: 500.0
    loop_rate_hz: 20.0

mcu_sim_node:
  ros__parameters:
    distance_left_cm: 80.0
    distance_right_cm: 80.0
    publish_rate_hz: 10.0
    fov_rad: 0.26
    min_range_m: 0.02
    max_range_m: 4.00
