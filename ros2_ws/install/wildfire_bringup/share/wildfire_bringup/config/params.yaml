# params.yaml — Wildfire Robotics UGV
# Configurazione centralizzata per tutti i nodi

wildfire_vision:

  camera_node:
    device_id: 0              # /dev/video0
    frame_width: 640
    frame_height: 480
    fps: 15
    camera_name: 'camera'     # topic: /camera/image_raw

  person_detector_node:
    camera_topic: '/camera/image_raw'
    conf_threshold: 0.5      # confidence minima per persona
    model_name: 'yolov8n.pt' # modello YOLOv8n
    device: 'cpu'            # cpu, cuda, mps

  fire_detector_node:
    camera_topic: '/camera/image_raw'

    # HSV rosso range 1
    red_h1_low: 0
    red_h1_high: 10
    # HSV rosso range 2
    red_h2_low: 170
    red_h2_high: 180
    # HSV arancione
    orange_h_low: 11
    orange_h_high: 25

    sat_min: 150            # saturazione minima (0-255)
    val_min: 150            # valore minimo (0-255)

    min_area: 500.0         # area minima blob fuoco (px²)
    kernel_size: 5          # dimensione kernel morfologico
    enable_red: true
    enable_orange: true


wildfire_control:

  state_machine_node:
    watchdog_timeout_ms: 500
    pan_home: 0.0          # gradi
    tilt_home: 0.0         # gradi

  follow_controller_node:
    target_distance_cm: 80.0       # distanza target dalla persona
    min_safe_distance_cm: 40.0    # stop di sicurezza
    max_distance_cm: 200.0       # portata max HC-SR04

    linear_kp: 0.01          # guadagno proporzionale lineare
    angular_kp: 0.5         # guadagno proporzionale angolare
    max_linear_speed: 0.5   # velocità lineare max [-1, 1]
    max_angular_speed: 1.0   # velocità angolare max [-1, 1]
    min_turn_speed: 0.2     # velocità minima in rotazione pura
    loop_rate_hz: 10.0      # frequenza loop follow

  fire_controller_node:
    pan_min_deg: -60.0
    pan_max_deg: 60.0
    tilt_min_deg: 0.0
    tilt_max_deg: 30.0

    sweep_step_deg: 10.0       # step pan per sweep (gradi)
    sweep_pause_s: 0.2         # pausa tra step sweep (s)
    tilt_increment_deg: 10.0    # incremento tilt a fine corsa pan (gradi)

    pd_kp_pan: 0.5          # guadagno P pan
    pd_kp_tilt: 0.5         # guadagno P tilt
    pd_kd: 0.1               # guadagno D (derivativo)

    lock_threshold_px: 20.0   # errore pixel per lock
    lock_time_s: 0.5          # tempo per acquisire lock
    unlock_time_s: 0.3        # tempo senza fuoco per perdere lock

    min_fire_area: 500.0    # area minima blob fuoco (px²)
    loop_rate_hz: 20.0      # frequenza loop fire
