; platformio.ini — Wildfire Robotics UGV
; Firmware micro-ROS per Arduino UNO Q (MCU: STM32U585AI)
;
; NOTE
; ----
; Arduino UNO Q (2025) is a dual-brain board: a Qualcomm Dragonwing MPU
; running Debian + a STM32U585AI MCU. This project targets ONLY the MCU
; side. The MPU runs ROS2 Humble + the micro-ROS Agent and talks to the
; MCU over the internal UART bridge mapped on D0/D1 of the UNO header.
;
; Build deps:
;   - framework-arduino-stm32   Arduino core for STM32 (UNO Q variant)
;   - micro_ros_platformio      micro-ROS client + Arduino transports
;   - Servo                     MG996R drive on hardware-timer PWM
;
; The official PlatformIO board id for the UNO Q is not yet published
; at the time of writing. We pin to a generic STM32U585 dev board and
; let the Arduino core variant for UNO Q resolve the silkscreen-to-pad
; mapping (D0..D13, A0..A5). Once Arduino publishes the official id,
; replace `board` and drop the explicit `board_build.*` overrides.

[platformio]
default_envs = uno_q_mcu

[env:uno_q_mcu]
platform        = ststm32
framework       = arduino
; TODO: replace with the official Arduino UNO Q board id once published.
board           = disco_b_u585i_iot02a
board_build.mcu       = stm32u585aii6q
board_build.f_cpu     = 160000000L

; --- Upload / debug ----------------------------------------------------
; UNO Q exposes the MCU through the onboard ST-LINK on the USB-C port.
upload_protocol = stlink
debug_tool      = stlink
monitor_speed   = 115200

; --- Libraries ---------------------------------------------------------
lib_deps =
    https://github.com/micro-ROS/micro_ros_platformio.git
; Note: Servo support comes from the framework-arduinoststm32 core
; (libraries/Servo). Adding arduino-libraries/Servo would pull the
; AVR/SAM-only version which fails to compile on STM32U5.

; --- Build flags -------------------------------------------------------
build_flags =
    -I include
    -I src/drivers
    -D MICRO_ROS_TRANSPORT_ARDUINO_SERIAL
    -D F_CPU=160000000L
    -Wall
    -Wextra

; --- Source filter -----------------------------------------------------
build_src_filter =
    +<*>
    -<*.txt>