; platformio.ini — Wildfire Robotics UGV
; TODO: Implementare configurazione PlatformIO per STM32U585
;
; Questo file configura la build del firmware MCU
; usando PlatformIO invece di STM32CubeMX

[env:uno_q_mcu]
platform = ststm32
board = TODO:identificare_la_board_Arduino_Uno_Q
framework = stm32cube

; Debugging
upload_protocol = stlink
debug_tool = stlink

; MCU Configuration
; TODO: Verificare i parametri corretti per STM32U585
board_build.mcu = stm32u585ai
board_build.f_cpu = 120000000L

; Include directories
build_flags =
    -I include
    -I src/drivers
    -I ../wildfire_msgs/msg

; Serial upload
monitor_speed = 115200

; Files to compile
src_filter =
    +<*>
    -<*.txt>
